<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Targaryen Dynasty | Fire & Blood</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Top Navigation -->
    <header class="top-bar">
      <div class="logo">
        <h1>Fire & Blood</h1>
        <span id="lbl-subtitle">The Targaryen Dynasty</span>
      </div>
      <div class="nav-controls">
        <input
          type="text"
          id="search-input"
          placeholder="Search a Targaryen..."
        />

        <div class="language-selector">
          <select id="lang-select" aria-label="Select Language">
            <option value="en" selected>🇬🇧 EN</option>
            <option value="es">🇪🇸 ES</option>
          </select>
        </div>
      </div>
    </header>

    <!-- The D3.js Canvas Container -->
    <main id="canvas-container">
      <svg id="tree-canvas" width="100%" height="100%">
        <defs>
          <!-- Circular clip path for avatar images -->
          <clipPath id="avatar-clip">
            <circle cx="0" cy="0" r="45" />
          </clipPath>
        </defs>
        <!-- Zoomable wrapper containing links and nodes -->
        <g id="zoom-group">
          <g id="links-group"></g>
          <g id="nodes-group"></g>
        </g>
      </svg>
    </main>

    <!-- NEW: Diligence Footer -->
    <footer class="app-footer">
      <p id="diligence-statement">
        <!-- Content will be injected by JavaScript -->
      </p>
    </footer>

    <!-- The Biography Side Drawer -->
    <aside id="bio-drawer" class="drawer">
      <button class="close-btn" id="close-drawer-btn">✕</button>

      <div class="drawer-content">
        <div class="bio-header">
          <div class="avatar-placeholder">
            <img src="" alt="Character Portrait" id="drawer-image" />
          </div>
          <h2 id="drawer-name">---</h2>
          <h3 id="drawer-titles">---</h3>
        </div>

        <div class="bio-meta">
          <div class="meta-item">
            <span class="meta-label" id="lbl-dragon">Dragon</span>
            <span class="meta-value dragon-name" id="drawer-dragon">---</span>
          </div>
          <div class="meta-item">
            <span class="meta-label" id="lbl-era">Reign / Era</span>
            <span class="meta-value" id="drawer-era">---</span>
          </div>
        </div>

        <div class="bio-tags" id="drawer-tags"></div>

        <div class="bio-body">
          <p id="drawer-text">---</p>
        </div>
      </div>
    </aside>

    <!-- D3.js Core & DAG Plugin -->
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-dag@1.0.0"></script>
    <script src="app.js"></script>
  </body>
</html>
